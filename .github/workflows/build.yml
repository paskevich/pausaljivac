name: Build desktop packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Install GTK3 runtime (WeasyPrint's Pango/Cairo/GDK-Pixbuf on Windows)
        shell: pwsh
        run: |
          $ProgressPreference = "SilentlyContinue"
          Invoke-WebRequest -Uri "https://github.com/tschoonj/GTK-for-Windows-Runtime-Environment-Installer/releases/download/2022-01-04/gtk3-runtime-3.24.31-2022-01-04-ts-win64.exe" -OutFile gtk-installer.exe
          Start-Process -FilePath .\gtk-installer.exe -ArgumentList "/S" -Wait

      - name: Build with PyInstaller
        run: pyinstaller pausaljivac.spec

      - name: Bundle GTK DLLs alongside the executable
        shell: pwsh
        run: |
          Copy-Item "C:\Program Files\GTK3-Runtime Win64\bin\*.dll" -Destination "dist\Pausaljivac\" -Force

      - name: Smoke-test the built exe (starts it, hits the dashboard and a WeasyPrint PDF endpoint)
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist\Pausaljivac\Pausaljivac.exe" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            try {
              $resp = Invoke-WebRequest -Uri "http://127.0.0.1:5000/" -UseBasicParsing -TimeoutSec 3
              if ($resp.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
          }
          if (-not $ok) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "App did not respond on http://127.0.0.1:5000/ within 60s"
          }
          $pdf = Invoke-WebRequest -Uri "http://127.0.0.1:5000/reports/kpo?year=2026" -UseBasicParsing -TimeoutSec 20
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if ($pdf.StatusCode -ne 200 -or $pdf.Headers["Content-Type"] -notlike "*pdf*") {
            throw "KPO PDF endpoint did not return a PDF — WeasyPrint/GTK bundling is likely broken"
          }
          Write-Host "Smoke test OK: dashboard + WeasyPrint PDF generation both work"

      - name: Zip the build
        shell: pwsh
        run: Compress-Archive -Path "dist\Pausaljivac\*" -DestinationPath "Pausaljivac-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Pausaljivac-windows
          path: Pausaljivac-windows.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install native dependencies (WeasyPrint's Pango/Cairo via Homebrew)
        run: |
          brew install pango dylibbundler

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller pausaljivac.spec

      - name: Bundle Homebrew dylibs into the .app (WeasyPrint loads them at runtime via cffi, not link-time, so they won't show up as normal dependencies)
        run: |
          set -e
          APP="dist/Pausaljivac.app"
          BIN="$APP/Contents/MacOS/Pausaljivac"
          LIBDIR="$APP/Contents/libs"
          mkdir -p "$LIBDIR"

          PREFIX=$(brew --prefix)

          # Copy every dylib WeasyPrint's native bindings might dlopen by name,
          # then let dylibbundler pull in their own recursive dependencies too.
          for name in cairo pango-1.0 pangocairo-1.0 gobject-2.0 glib-2.0 gdk_pixbuf-2.0 fontconfig harfbuzz; do
            found=$(find "$PREFIX/lib" -maxdepth 1 -name "lib${name}*.dylib" 2>/dev/null | head -n1 || true)
            if [ -n "$found" ]; then
              cp -n "$found" "$LIBDIR/" || true
            fi
          done

          for lib in "$LIBDIR"/*.dylib; do
            [ -e "$lib" ] || continue
            dylibbundler -of -b -x "$lib" -d "$LIBDIR" -p "@executable_path/../libs/" || true
          done
          dylibbundler -of -b -x "$BIN" -d "$LIBDIR" -p "@executable_path/../libs/" || true

      - name: Wrap the launcher to point WeasyPrint's native loader at the bundled libs
        run: |
          set -e
          APP="dist/Pausaljivac.app"
          MACOS_DIR="$APP/Contents/MacOS"
          mv "$MACOS_DIR/Pausaljivac" "$MACOS_DIR/Pausaljivac.bin"
          {
            printf '%s\n' '#!/bin/bash'
            printf '%s\n' 'DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"'
            printf '%s\n' 'export DYLD_LIBRARY_PATH="$DIR/../libs:$DYLD_LIBRARY_PATH"'
            printf '%s\n' 'exec "$DIR/Pausaljivac.bin" "$@"'
          } > "$MACOS_DIR/Pausaljivac"
          chmod +x "$MACOS_DIR/Pausaljivac"

      - name: Smoke-test the built app (starts it, hits the dashboard and a WeasyPrint PDF endpoint)
        run: |
          set -e
          "dist/Pausaljivac.app/Contents/MacOS/Pausaljivac" &
          APP_PID=$!
          ok=0
          for i in $(seq 1 30); do
            sleep 2
            if curl -sf -o /dev/null "http://127.0.0.1:5000/"; then
              ok=1
              break
            fi
          done
          if [ "$ok" -ne 1 ]; then
            kill "$APP_PID" 2>/dev/null || true
            echo "App did not respond on http://127.0.0.1:5000/ within 60s"
            exit 1
          fi
          content_type=$(curl -sf -D - -o /dev/null "http://127.0.0.1:5000/reports/kpo?year=2026" | grep -i '^content-type:' || true)
          echo "KPO endpoint content-type: $content_type"
          kill "$APP_PID" 2>/dev/null || true
          if ! echo "$content_type" | grep -qi pdf; then
            echo "KPO PDF endpoint did not return a PDF — WeasyPrint/dylib bundling is likely broken"
            exit 1
          fi
          echo "Smoke test OK: dashboard + WeasyPrint PDF generation both work"

      - name: Zip the .app
        run: ditto -c -k --sequesterRsrc --keepParent dist/Pausaljivac.app Pausaljivac-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Pausaljivac-macos
          path: Pausaljivac-macos.zip

  release:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Pausaljivac-windows/Pausaljivac-windows.zip
            artifacts/Pausaljivac-macos/Pausaljivac-macos.zip
