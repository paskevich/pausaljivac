<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Paušal 3000{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <nav class="topnav">
    <a class="brand" href="{{ url_for('dashboard.index') }}">Paušal 3000</a>
    <a href="{{ url_for('dashboard.index') }}">Дашборд</a>
    <a href="{{ url_for('clients.list_clients') }}">Клиенты</a>
    <a href="{{ url_for('invoices.list_invoices') }}">Инвойсы</a>
    <a href="{{ url_for('documents.list_documents') }}">Документы</a>
    <a href="{{ url_for('tax.list_resenja') }}">Налоги</a>
    <a href="{{ url_for('settings.edit_settings') }}">Настройки</a>
  </nav>

  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-list">
          {% for category, message in messages %}
            <div class="flash flash-{{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
